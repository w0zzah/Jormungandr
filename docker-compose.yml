services:
  db:
    image: postgres:16
    container_name: jormungandr-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jormungandr
      POSTGRES_PASSWORD: jormungandr
      POSTGRES_DB: jormungandr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: